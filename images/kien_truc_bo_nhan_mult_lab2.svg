<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 500" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <!-- Multiplier Block Gradient -->
    <linearGradient id="multGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- MUX Gradient -->
    <linearGradient id="muxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Flip-Flop Register Gradient -->
    <linearGradient id="ffGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>

    <!-- Bus Pin Gradients -->
    <linearGradient id="inBusGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="outBusGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arrCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#f87171"/>
    </marker>
    <marker id="arrPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#c084fc"/>
    </marker>
    <marker id="arrOrange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#fb923c"/>
    </marker>
    <marker id="arrClock" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M 0 1 L 6 3.5 L 0 6 z" fill="#94a3b8"/>
    </marker>

    <!-- Glow Filter for Critical Path -->
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1020" height="500" fill="url(#bgGrad)"/>
  
  <!-- Outer Frame -->
  <rect x="15" y="15" width="990" height="470" rx="14" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(35, 40)">
    <rect x="0" y="0" width="4" height="26" rx="2" fill="#38bdf8"/>
    <text x="14" y="19" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="17" font-weight="bold" letter-spacing="0.5">SƠ ĐỒ KHỐI PHẦN CỨNG: BỘ NHÂN 8-BIT REGISTERED MULTIPLIER (mult.v)</text>
    <text x="14" y="38" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5">Mô hình đường truyền tín hiệu từ ngõ vào chưa đệm (Unregistered Inputs) đến thanh ghi chốt ngõ ra</text>
  </g>

  <!-- ==================== INPUT PADS (PORTS) ==================== -->
  <!-- Port A: a[7:0] -->
  <g transform="translate(40, 120)">
    <rect x="0" y="0" width="105" height="46" rx="7" fill="url(#inBusGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="52" y="21" fill="#0f172a" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">a[7:0]</text>
    <text x="52" y="36" fill="#0369a1" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">Port Đầu Vào 8-bit</text>
    <!-- Bus hash mark -->
    <line x1="120" y1="18" x2="130" y2="28" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="125" y="15" fill="#38bdf8" font-family="monospace" font-size="9" text-anchor="middle">8</text>
  </g>

  <!-- Port B: b[7:0] (CRITICAL SOURCE b[6]) -->
  <g transform="translate(40, 210)">
    <rect x="0" y="0" width="105" height="46" rx="7" fill="url(#inBusGrad)" stroke="#f87171" stroke-width="2"/>
    <text x="52" y="21" fill="#0f172a" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">b[7:0]</text>
    <text x="52" y="36" fill="#7f1d1d" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Chứa b[6] VI PHẠM</text>
    <!-- Bus hash mark -->
    <line x1="120" y1="18" x2="130" y2="28" stroke="#f87171" stroke-width="1.5"/>
    <text x="125" y="15" fill="#f87171" font-family="monospace" font-size="9" text-anchor="middle">8</text>
  </g>

  <!-- Port Reset: rst -->
  <g transform="translate(40, 315)">
    <rect x="0" y="0" width="105" height="40" rx="7" fill="#431407" stroke="#fb923c" stroke-width="1.5"/>
    <text x="52" y="19" fill="#fed7aa" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">rst</text>
    <text x="52" y="32" fill="#ea580c" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Reset Đồng Bộ</text>
  </g>

  <!-- Port Clock: clk -->
  <g transform="translate(40, 385)">
    <rect x="0" y="0" width="105" height="40" rx="7" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="52" y="19" fill="#f8fafc" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">clk</text>
    <text x="52" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">13ns / 77MHz</text>
  </g>

  <!-- ==================== BLOCK 1: MULTIPLIER CORE ==================== -->
  <g transform="translate(230, 110)">
    <rect x="0" y="0" width="230" height="175" rx="12" fill="url(#multGrad)" stroke="#475569" stroke-width="2"/>
    <rect x="0" y="0" width="230" height="34" rx="12" fill="#1e293b"/>
    <text x="115" y="22" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">MẠCH NHÂN MA TRẬN 8x8</text>
    
    <!-- Internal details -->
    <text x="115" y="65" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Mạch Tổ Hợp Thuần Túy</text>
    <text x="115" y="82" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">p_wire = a * b</text>
    <text x="115" y="105" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Gồm 64 cổng AND tích từng phần</text>
    <text x="115" y="122" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">+ Cây cộng Carry-Save Adders</text>
    
    <!-- Delay Warning Badge -->
    <rect x="25" y="138" width="180" height="24" rx="5" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
    <text x="115" y="154" fill="#fca5a5" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">Trễ T_mult cực lớn (~8-9ns)</text>
  </g>

  <!-- Bus wires from Ports to Multiplier -->
  <!-- Wire A -->
  <path d="M 145 143 L 230 143" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrCyan)"/>
  <!-- Wire B (Critical Path part) -->
  <path d="M 145 233 L 230 233" fill="none" stroke="#f87171" stroke-width="3.5" filter="url(#glowRed)" marker-end="url(#arrRed)"/>

  <!-- ==================== BLOCK 2: RESET MUX 2:1 ==================== -->
  <g transform="translate(535, 125)">
    <!-- Trapezoid MUX shape -->
    <path d="M 0 0 L 75 25 L 75 125 L 0 150 Z" fill="url(#muxGrad)" stroke="#64748b" stroke-width="1.8"/>
    <text x="32" y="70" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">MUX</text>
    <text x="32" y="86" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">2 : 1</text>
    <text x="32" y="99" fill="#cbd5e1" font-family="monospace" font-size="8.5" text-anchor="middle">16-bit</text>
    
    <!-- MUX Input labels -->
    <text x="12" y="32" fill="#f87171" font-family="monospace" font-size="10.5" font-weight="bold">0</text>
    <text x="12" y="125" fill="#fed7aa" font-family="monospace" font-size="10.5" font-weight="bold">1</text>
    <!-- Reset Control Port at bottom -->
    <text x="45" y="145" fill="#fb923c" font-family="monospace" font-size="9.5" text-anchor="middle">rst</text>
    
    <!-- Ground / Zero input for reset -->
    <rect x="-45" y="112" width="40" height="22" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="-25" y="127" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">16'b0</text>
    <path d="M -5 123 L 0 123" fill="none" stroke="#94a3b8" stroke-width="2"/>
  </g>

  <!-- Bus wire from Multiplier to MUX (Critical) -->
  <path d="M 460 160 L 535 160" fill="none" stroke="#f87171" stroke-width="3.5" filter="url(#glowRed)" marker-end="url(#arrRed)"/>
  <!-- Bus 16 mark -->
  <line x1="490" y1="153" x2="502" y2="167" stroke="#f87171" stroke-width="1.5"/>
  <text x="496" y="148" fill="#f87171" font-family="monospace" font-size="9.5" text-anchor="middle">16</text>

  <!-- Reset line from rst Port to MUX -->
  <path d="M 145 335 L 575 335 L 575 255" fill="none" stroke="#fb923c" stroke-width="2" marker-end="url(#arrOrange)"/>

  <!-- ==================== BLOCK 3: OUTPUT REGISTERS (16x D-FF) ==================== -->
  <g transform="translate(685, 120)">
    <rect x="0" y="0" width="135" height="160" rx="10" fill="url(#ffGrad)" stroke="#60a5fa" stroke-width="2"/>
    <rect x="0" y="0" width="135" height="32" rx="10" fill="#1d4ed8"/>
    <text x="67" y="21" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">16x FLIP-FLOPS</text>
    
    <!-- Internal details -->
    <text x="67" y="52" fill="#bfdbfe" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">Tầng Chốt Ngõ Ra</text>
    <text x="67" y="68" fill="#e0e7ff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">p &lt;= p_next</text>
    
    <!-- Pins with explicit labels -->
    <!-- D pin input -->
    <circle cx="0" cy="95" r="4.5" fill="#f87171" stroke="#ffffff" stroke-width="1.5"/>
    <text x="14" y="99" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">D[15:0]</text>
    <text x="14" y="112" fill="#fca5a5" font-family="monospace" font-size="8.5">(Cell _646_/D)</text>

    <!-- Q pin output -->
    <circle cx="135" cy="95" r="4.5" fill="#c084fc" stroke="#ffffff" stroke-width="1.5"/>
    <text x="100" y="99" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">Q[15:0]</text>

    <!-- Clock pin at bottom -->
    <path d="M 60 160 L 67 148 L 74 160" fill="none" stroke="#ffffff" stroke-width="1.8"/>
    <circle cx="67" cy="160" r="3.5" fill="#94a3b8"/>
    <text x="67" y="140" fill="#93c5fd" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">CK</text>
  </g>

  <!-- Bus wire from MUX to FF (Critical) -->
  <path d="M 610 188 L 647 188 L 647 215 L 685 215" fill="none" stroke="#f87171" stroke-width="3.5" filter="url(#glowRed)" marker-end="url(#arrRed)"/>
  <!-- Bus 16 mark -->
  <line x1="620" y1="181" x2="632" y2="195" stroke="#f87171" stroke-width="1.5"/>
  <text x="626" y="176" fill="#f87171" font-family="monospace" font-size="9.5" text-anchor="middle">16</text>

  <!-- ==================== OUTPUT PAD: p[15:0] ==================== -->
  <g transform="translate(885, 192)">
    <rect x="0" y="0" width="105" height="46" rx="7" fill="url(#outBusGrad)" stroke="#c084fc" stroke-width="1.5"/>
    <text x="52" y="21" fill="#0f172a" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">p[15:0]</text>
    <text x="52" y="36" fill="#581c87" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Port Đầu Ra 16-bit</text>
  </g>

  <!-- Bus wire from FF to Output Port -->
  <path d="M 820 215 L 885 215" fill="none" stroke="#c084fc" stroke-width="3" marker-end="url(#arrPurple)"/>
  <!-- Bus 16 mark -->
  <line x1="845" y1="208" x2="857" y2="222" stroke="#c084fc" stroke-width="1.5"/>
  <text x="851" y="203" fill="#c084fc" font-family="monospace" font-size="9.5" text-anchor="middle">16</text>

  <!-- ==================== CLOCK DISTRIBUTION WIRE ==================== -->
  <path d="M 145 405 L 752 405 L 752 280" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#arrClock)"/>
  <text x="440" y="398" fill="#94a3b8" font-family="monospace" font-size="10.5">Clock Tree Mạng Lưới Nhịp Đồng Hồ (CLK)</text>

  <!-- ==================== CRITICAL PATH ANNOTATION BANNER ==================== -->
  <g transform="translate(35, 435)">
    <rect x="0" y="0" width="950" height="42" rx="7" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
    <text x="20" y="25" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold">🚨 CRITICAL PATH (Path 1: In2Reg):</text>
    <text x="280" y="25" fill="#fecaca" font-family="monospace" font-size="11">Chân b[6] ──► T_in (3.0ns) + T_mult (8.5ns) + T_mux (0.8ns) ──► Chân D cell _646_</text>
    <text x="930" y="25" fill="#f87171" font-family="monospace" font-size="11.5" font-weight="bold" text-anchor="end">WNS = -0.1477ns (FAIL!)</text>
  </g>

</svg>
