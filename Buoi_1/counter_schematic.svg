<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 550" width="100%" height="100%" style="background-color: #0b1120; font-family: 'Segoe UI', 'Consolas', monospace;">
  <defs>
    <!-- Arrow marker for 8-bit Data Bus (Cyan) -->
    <marker id="arr-bus" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <!-- Arrow marker for Control Signals (Amber) -->
    <marker id="arr-ctrl" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 2 L 7 5 L 0 8 z" fill="#fbbf24"/>
    </marker>
    <!-- Arrow marker for Clock (Rose) -->
    <marker id="arr-clk" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 2 L 7 5 L 0 8 z" fill="#f43f5e"/>
    </marker>

    <!-- Drop Shadows -->
    <filter id="shadow-reg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#6366f1" flood-opacity="0.35"/>
    </filter>
    <filter id="shadow-comb" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.3"/>
    </filter>
    <filter id="shadow-mux" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#059669" flood-opacity="0.3"/>
    </filter>
    <filter id="shadow-mux-rst" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#e11d48" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Canvas Border -->
  <rect x="15" y="15" width="1030" height="520" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>

  <!-- Title & Legend Header -->
  <text x="40" y="48" fill="#38bdf8" font-size="18" font-weight="bold" letter-spacing="0.5">SƠ ĐỒ NGUYÊN LÝ CHUẨN: 8-BIT SYNCHRONOUS COUNTER</text>
  <text x="40" y="70" fill="#94a3b8" font-size="12">Biểu tượng hình thang chuẩn Điện tử số (Trapezoid Multiplexers) &amp; Luồng Bus 1 chiều</text>

  <!-- Legend (Bảng chú giải tín hiệu) -->
  <g transform="translate(680, 32)">
    <rect x="0" y="0" width="340" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <!-- Data Bus -->
    <line x1="15" y1="21" x2="40" y2="21" stroke="#38bdf8" stroke-width="3"/>
    <text x="48" y="25" fill="#cbd5e1" font-size="11">Bus dữ liệu [7:0]</text>
    <!-- Control -->
    <line x1="150" y1="21" x2="175" y2="21" stroke="#fbbf24" stroke-width="2"/>
    <text x="183" y="25" fill="#cbd5e1" font-size="11">Tín hiệu đ/khiển</text>
    <!-- Clock -->
    <line x1="265" y1="21" x2="285" y2="21" stroke="#f43f5e" stroke-width="2"/>
    <text x="293" y="25" fill="#cbd5e1" font-size="11">Clock</text>
  </g>

  <!-- ========================================================================= -->
  <!-- TOP CONTROL PORTS (CÁC CHÂN ĐIỀU KHIỂN ĐƯA TRỰC TIẾP TỪ TRÊN XUỐNG)      -->
  <!-- ========================================================================= -->

  <!-- Port: en (Enable) -->
  <g transform="translate(365, 95)">
    <rect x="-25" y="0" width="50" height="26" rx="5" fill="#78350f" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="0" y="17" fill="#fef08a" font-size="12" font-weight="bold" text-anchor="middle">en</text>
  </g>
  <!-- Wire: en -> MUX 1 Select (Đi thẳng đứng vào cạnh vát trên của hình thang) -->
  <path d="M 365 121 L 365 190" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arr-ctrl)"/>
  <text x="375" y="160" fill="#fbbf24" font-size="10" font-weight="bold">sel</text>

  <!-- Port: rst (Reset) -->
  <g transform="translate(525, 95)">
    <rect x="-25" y="0" width="50" height="26" rx="5" fill="#831843" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="0" y="17" fill="#fecdd3" font-size="12" font-weight="bold" text-anchor="middle">rst</text>
  </g>
  <!-- Wire: rst -> MUX 2 Select (Đi thẳng đứng vào cạnh vát trên của hình thang) -->
  <path d="M 525 121 L 525 190" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arr-ctrl)"/>
  <text x="535" y="160" fill="#fbbf24" font-size="10" font-weight="bold">sel</text>

  <!-- Generator: Constant 8'h00 (Reset Value) -->
  <g transform="translate(435, 130)">
    <rect x="0" y="0" width="50" height="24" rx="4" fill="#334155" stroke="#64748b"/>
    <text x="25" y="16" fill="#f1f5f9" font-size="10" font-weight="bold" text-anchor="middle">8'h00</text>
  </g>
  <!-- Wire: 8'h00 -> MUX 2 input [1] -->
  <path d="M 460 154 L 460 215 L 490 215" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr-bus)"/>

  <!-- ========================================================================= -->
  <!-- MAIN DATAPATH PIPELINE (LUỒNG XỬ LÝ CHÍNH TỪ TRÁI QUA PHẢI)               -->
  <!-- ========================================================================= -->

  <!-- KHỐI 1: BỘ CỘNG 8-BIT (ADDER) -->
  <g filter="url(#shadow-comb)">
    <rect x="150" y="185" width="120" height="110" rx="8" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
    <text x="210" y="228" fill="#bfdbfe" font-size="15" font-weight="bold" text-anchor="middle">BỘ CỘNG</text>
    <text x="210" y="248" fill="#93c5fd" font-size="12" text-anchor="middle">(Adder +1)</text>

    <!-- Pin labels -->
    <text x="158" y="222" fill="#cbd5e1" font-size="10">A[7:0]</text>
    <text x="158" y="272" fill="#cbd5e1" font-size="10">B[7:0]</text>
    <text x="238" y="230" fill="#cbd5e1" font-size="10">SUM</text>
  </g>

  <!-- Constant +1'b1 cấp cho chân B của bộ cộng -->
  <rect x="80" y="260" width="45" height="24" rx="4" fill="#334155" stroke="#64748b"/>
  <text x="102" y="276" fill="#f1f5f9" font-size="11" font-weight="bold" text-anchor="middle">+ 1</text>
  <path d="M 125 272 L 150 272" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr-bus)"/>

  <!-- Wire: Adder SUM -> MUX 1 input [1] (Đường thẳng tắp ở y=225) -->
  <path d="M 270 225 L 330 225" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arr-bus)"/>
  <line x1="295" y1="218" x2="305" y2="232" stroke="#38bdf8" stroke-width="2"/>
  <text x="300" y="215" fill="#38bdf8" font-size="10">/8</text>

  <!-- KHỐI 2: MUX 1 (HÌNH THANG CÂN KINH ĐIỂN CỦA ĐIỆN TỬ SỐ) -->
  <g filter="url(#shadow-mux)">
    <!-- Trapezoid Path: Cạnh trái dài (180->310), Cạnh phải ngắn (205->285) -->
    <path d="M 330 180 L 405 205 L 405 285 L 330 310 Z" fill="#065f46" stroke="#10b981" stroke-width="2"/>
    <text x="368" y="243" fill="#a7f3d0" font-size="13" font-weight="bold" text-anchor="middle">MUX 1</text>
    <text x="368" y="258" fill="#6ee7b7" font-size="10" text-anchor="middle">(Enable)</text>

    <!-- Inputs on wide left edge -->
    <text x="338" y="230" fill="#e2e8f0" font-size="12" font-weight="bold">1</text>
    <text x="338" y="280" fill="#e2e8f0" font-size="12" font-weight="bold">0</text>
    <!-- Output on narrow right edge -->
    <text x="395" y="249" fill="#e2e8f0" font-size="10">Y</text>
  </g>

  <!-- Wire: MUX 1 Output -> MUX 2 input [0] (Đường thẳng tắp ở y=245) -->
  <path d="M 405 245 L 490 245" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arr-bus)"/>
  <line x1="442" y1="238" x2="452" y2="252" stroke="#38bdf8" stroke-width="2"/>
  <text x="447" y="235" fill="#38bdf8" font-size="10">/8</text>

  <!-- KHỐI 3: MUX 2 (HÌNH THANG CÂN KINH ĐIỂN CHO RESET) -->
  <g filter="url(#shadow-mux-rst)">
    <!-- Trapezoid Path -->
    <path d="M 490 180 L 565 205 L 565 285 L 490 310 Z" fill="#831843" stroke="#f43f5e" stroke-width="2"/>
    <text x="528" y="243" fill="#fbcfe8" font-size="13" font-weight="bold" text-anchor="middle">MUX 2</text>
    <text x="528" y="258" fill="#f472b6" font-size="10" text-anchor="middle">(Reset)</text>

    <!-- Inputs on wide left edge -->
    <text x="498" y="220" fill="#e2e8f0" font-size="12" font-weight="bold">1</text>
    <text x="498" y="250" fill="#e2e8f0" font-size="12" font-weight="bold">0</text>
    <!-- Output on narrow right edge -->
    <text x="555" y="249" fill="#e2e8f0" font-size="10">Y</text>
  </g>

  <!-- Wire: MUX 2 Output -> D-FF Register D[7:0] (Đường thẳng tắp ở y=245) -->
  <path d="M 565 245 L 650 245" fill="none" stroke="#38bdf8" stroke-width="3.5" marker-end="url(#arr-bus)"/>
  <line x1="602" y1="238" x2="612" y2="252" stroke="#38bdf8" stroke-width="2"/>
  <text x="600" y="233" fill="#38bdf8" font-size="11" font-weight="bold">D[7:0]</text>

  <!-- KHỐI 4: THANH GHI 8-BIT D-FLIP-FLOP -->
  <g filter="url(#shadow-reg)">
    <rect x="650" y="170" width="170" height="150" rx="10" fill="#1e1b4b" stroke="#818cf8" stroke-width="2.5"/>
    <text x="735" y="215" fill="#e0e7ff" font-size="15" font-weight="bold" text-anchor="middle">8x D-FLIP-FLOP</text>
    <text x="735" y="235" fill="#c7d2fe" font-size="12" text-anchor="middle">Thanh ghi trạng thái</text>
    <text x="735" y="255" fill="#a5b4fc" font-size="10" text-anchor="middle">(Synchronous Register)</text>

    <!-- Pins -->
    <text x="658" y="249" fill="#cbd5e1" font-size="11" font-weight="bold">D[7:0]</text>
    <text x="785" y="249" fill="#cbd5e1" font-size="11" font-weight="bold">Q[7:0]</text>

    <!-- Clock Triangle on Bottom Face -->
    <path d="M 725 320 L 735 305 L 745 320 Z" fill="none" stroke="#f43f5e" stroke-width="2"/>
    <text x="735" y="295" fill="#f43f5e" font-size="10" font-weight="bold" text-anchor="middle">CLK</text>
  </g>

  <!-- Clock Input Port (Dưới chân thanh ghi, đi thẳng lên) -->
  <g transform="translate(735, 470)">
    <circle cx="0" cy="0" r="14" fill="#881337" stroke="#f43f5e" stroke-width="2"/>
    <text x="0" y="4" fill="#ffe4e6" font-size="11" font-weight="bold" text-anchor="middle">clk</text>
  </g>
  <path d="M 735 456 L 735 320" fill="none" stroke="#f43f5e" stroke-width="2.5" marker-end="url(#arr-clk)"/>

  <!-- Output Port count[7:0] -->
  <path d="M 820 245 L 900 245" fill="none" stroke="#38bdf8" stroke-width="4" marker-end="url(#arr-bus)"/>
  <circle cx="860" cy="245" r="5" fill="#38bdf8"/> <!-- Điểm trích nhánh rẽ sang Bus phản hồi -->
  <line x1="875" y1="237" x2="885" y2="253" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="880" y="233" fill="#38bdf8" font-size="11" font-weight="bold">/8</text>

  <g transform="translate(900, 225)">
    <rect x="0" y="0" width="115" height="40" rx="6" fill="#0369a1" stroke="#38bdf8" stroke-width="2"/>
    <text x="57" y="25" fill="#f0f9ff" font-size="13" font-weight="bold" text-anchor="middle">count[7:0]</text>
  </g>

  <!-- ========================================================================= -->
  <!-- HIGHWAY PHẢN HỒI (DEDICATED FEEDBACK CORRIDOR - CHẠY RIÊNG LÀN DƯỚI)       -->
  <!-- ========================================================================= -->

  <!-- Đường Bus phản hồi bắt đầu từ điểm rẽ x=860, chạy xuống hành lang y=400, lộn về trái -->
  <path d="M 860 245 
           L 860 400 
           L 60 400 
           L 60 218 
           L 150 218" 
        fill="none" stroke="#0ea5e9" stroke-width="3" stroke-dasharray="8 4" marker-end="url(#arr-bus)"/>

  <!-- Nhánh rẽ cấp giá trị cũ về MUX 1 input [0] (Giữ nguyên giá trị khi en=0) -->
  <path d="M 305 400 
           L 305 275 
           L 330 275" 
        fill="none" stroke="#0ea5e9" stroke-width="2.5" stroke-dasharray="8 4" marker-end="url(#arr-bus)"/>
  <circle cx="305" cy="400" r="4.5" fill="#0ea5e9"/>

  <!-- Nhãn giải thích hành lang phản hồi -->
  <rect x="360" y="388" width="310" height="24" rx="4" fill="#0f172a" stroke="#0ea5e9" stroke-width="1"/>
  <text x="515" y="404" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">FEEDBACK HIGHWAY: count[7:0] phản hồi (Không cắt chéo)</text>

</svg>
