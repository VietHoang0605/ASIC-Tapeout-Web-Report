<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" width="100%" height="100%" style="background:#0f172a; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="920" height="490" fill="url(#bgGrad)"/>

  <!-- Header -->
  <g transform="translate(30, 25)">
    <rect x="0" y="0" width="860" height="52" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="24" fill="#f8fafc" font-size="17" font-weight="bold">BẢN CHẤT VẬT LÝ NỘI TẠI CỦA SETUP TIME (T_setup) TRONG D-FLIP-FLOP</text>
    <text x="20" y="42" fill="#94a3b8" font-size="12">Cơ chế nạp điện tích tụ điện cực cổng CMOS: T_setup phụ thuộc hằng số thời gian RC nội tại, bất biến với chu kỳ Clock</text>
  </g>

  <!-- LEFT PANEL: SCHEMATIC OF MASTER LATCH STAGE -->
  <g transform="translate(30, 95)">
    <rect x="0" y="0" width="450" height="365" rx="10" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="1.5"/>
    
    <!-- Panel Title -->
    <rect x="15" y="14" width="220" height="26" rx="4" fill="#334155"/>
    <text x="25" y="32" fill="#38bdf8" font-size="12" font-weight="bold">1. TẦNG CHỐT NỘI BỘ (MASTER LATCH)</text>

    <!-- Data Input D -->
    <line x1="20" y1="130" x2="80" y2="130" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrowAmber)"/>
    <text x="25" y="120" fill="#fbbf24" font-size="13" font-weight="bold">D (Dữ liệu)</text>

    <!-- Transmission Gate TG1 Box -->
    <rect x="80" y="95" width="85" height="70" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="122" y="125" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">Cổng truyền</text>
    <text x="122" y="142" fill="#7dd3fc" font-size="10" text-anchor="middle">T-Gate (TG1)</text>

    <!-- Ron Label -->
    <text x="122" y="185" fill="#94a3b8" font-size="10" text-anchor="middle">Trở dẫn: R_on</text>

    <!-- Clock Control lines -->
    <line x1="122" y1="55" x2="122" y2="95" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="122" y="50" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">CLK / CLK_b</text>

    <!-- Line from TG1 to INV1 -->
    <line x1="165" y1="130" x2="230" y2="130" stroke="#e2e8f0" stroke-width="2.5"/>

    <!-- Storage Node S with Gate Capacitance C_gate -->
    <circle cx="200" cy="130" r="5" fill="#f59e0b"/>
    <text x="200" y="115" fill="#f59e0b" font-size="11" font-weight="bold" text-anchor="middle">Nút Master (S)</text>

    <!-- Capacitor Symbol down to GND -->
    <line x1="200" y1="130" x2="200" y2="200" stroke="#f59e0b" stroke-width="1.5"/>
    <line x1="185" y1="200" x2="215" y2="200" stroke="#38bdf8" stroke-width="2.5"/>
    <line x1="188" y1="208" x2="212" y2="208" stroke="#38bdf8" stroke-width="2.5"/>
    <line x1="200" y1="208" x2="200" y2="225" stroke="#64748b" stroke-width="1.5"/>
    <line x1="192" y1="225" x2="208" y2="225" stroke="#64748b" stroke-width="1.5"/>
    <line x1="195" y1="229" x2="205" y2="229" stroke="#64748b" stroke-width="1.5"/>
    
    <text x="225" y="208" fill="#38bdf8" font-size="11" font-weight="bold">C_gate</text>
    <text x="225" y="222" fill="#94a3b8" font-size="10">(Điện dung cực cổng)</text>

    <!-- Inverter 1 (Triangle + Bubble) -->
    <polygon points="230,105 230,155 275,130" fill="#1e293b" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="280" cy="130" r="5" fill="#1e293b" stroke="#e2e8f0" stroke-width="2"/>
    <text x="250" y="134" fill="#e2e8f0" font-size="11" font-weight="bold" text-anchor="middle">INV1</text>

    <!-- Connection to Master Output Q_master -->
    <line x1="285" y1="130" x2="360" y2="130" stroke="#e2e8f0" stroke-width="2.5"/>
    <circle cx="330" cy="130" r="4" fill="#38bdf8"/>
    <text x="380" y="134" fill="#38bdf8" font-size="12" font-weight="bold">Q_m</text>

    <!-- Feedback Latch Loop (INV2 + TG2) -->
    <line x1="330" y1="130" x2="330" y2="280" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="330" y1="280" x2="295" y2="280" stroke="#94a3b8" stroke-width="1.5"/>

    <polygon points="295,260 295,300 255,280" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="250" cy="280" r="4" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="277" y="284" fill="#94a3b8" font-size="10" text-anchor="middle">INV2</text>

    <!-- Feedback TG2 -->
    <rect x="175" y="260" width="55" height="40" rx="4" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="202" y="284" fill="#94a3b8" font-size="9" text-anchor="middle">TG2</text>
    
    <line x1="246" y1="280" x2="230" y2="280" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="175" y1="280" x2="140" y2="280" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="140" y1="280" x2="140" y2="130" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,2"/>

    <!-- Bottom Explanation Card -->
    <rect x="15" y="318" width="420" height="35" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="335" fill="#fca5a5" font-size="10" font-weight="bold">⚠️ Khi Clock kích hoạt:</text>
    <text x="25" y="347" fill="#94a3b8" font-size="10">TG1 ngắt dẫn lập tức. Nếu C_gate chưa nạp đủ điện áp ngưỡng, bit chốt sẽ bị lỗi!</text>
  </g>

  <!-- RIGHT PANEL: CAPACITOR CHARGING CURVE & PHYSICS PROOF -->
  <g transform="translate(500, 95)">
    <rect x="0" y="0" width="390" height="365" rx="10" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="1.5"/>

    <rect x="15" y="14" width="240" height="26" rx="4" fill="#334155"/>
    <text x="25" y="32" fill="#10b981" font-size="12" font-weight="bold">2. ĐƯỜNG NẠP ĐIỆN VẬT LÝ RC</text>

    <!-- Axes -->
    <line x1="45" y1="240" x2="355" y2="240" stroke="#64748b" stroke-width="1.5"/> <!-- Time Axis -->
    <line x1="45" y1="240" x2="45" y2="60" stroke="#64748b" stroke-width="1.5"/> <!-- Voltage Axis -->

    <text x="355" y="255" fill="#94a3b8" font-size="11" text-anchor="end">Thời gian (t)</text>
    <text x="40" y="55" fill="#94a3b8" font-size="11">Điện áp V(t)</text>

    <!-- VDD Level (1.8V) -->
    <line x1="45" y1="80" x2="350" y2="80" stroke="#64748b" stroke-dasharray="3,3"/>
    <text x="38" y="84" fill="#94a3b8" font-size="10" text-anchor="end">VDD (1.8V)</text>

    <!-- Threshold Voltage Vth Level (0.9V) -->
    <line x1="45" y1="160" x2="350" y2="160" stroke="#ef4444" stroke-dasharray="2,2"/>
    <text x="38" y="164" fill="#ef4444" font-size="10" text-anchor="end">V_th (Ngưỡng)</text>

    <!-- Charging Curve: V(t) = VDD * (1 - exp(-t/tau)) -->
    <!-- Path starting at (45, 240), reaching ~160 at x=135, ~95 at x=235 -->
    <path d="M 45 240 Q 110 130 180 100 T 350 82" fill="none" stroke="url(#curveGrad)" stroke-width="3"/>

    <!-- Shaded T_setup Requirement Zone -->
    <rect x="45" y="60" width="165" height="180" fill="#38bdf8" fill-opacity="0.08"/>
    <line x1="210" y1="60" x2="210" y2="240" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="210" y="255" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">T_setup</text>

    <!-- Bracket for T_setup -->
    <line x1="45" y1="225" x2="210" y2="225" stroke="#38bdf8" stroke-width="1.5" marker-start="url(#arrowCyan)" marker-end="url(#arrowCyan)"/>
    <text x="127" y="218" fill="#7dd3fc" font-size="11" font-weight="bold" text-anchor="middle">T_setup ≈ 3 × τ</text>

    <!-- Formula Box -->
    <rect x="25" y="275" width="340" height="75" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="35" y="295" fill="#38bdf8" font-size="12" font-weight="bold">Phương trình vi phân nạp cực cổng:</text>
    <text x="35" y="315" fill="#fde68a" font-family="monospace" font-size="12">τ = R_on × C_gate  (Hằng số thời gian RC)</text>
    <text x="35" y="333" fill="#cbd5e1" font-size="10.5">Thời gian này đúc chết trên Silicon, hoàn toàn độc lập với T_clk!</text>
  </g>
</svg>