<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 690" width="100%" height="100%" style="background:#0f172a; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradFf3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cloudGradFf3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Hatched Patterns -->
    <pattern id="hatchRedFf3" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#ef4444" stroke-width="2" opacity="0.6"/>
    </pattern>
    <pattern id="hatchAmberFf3" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>
    </pattern>

    <!-- Markers -->
    <marker id="arrCyan3" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrAmber3" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrGreen3" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1060" height="690" fill="url(#bgGradFf3)"/>

  <!-- Master Header -->
  <g transform="translate(35, 18)">
    <rect x="0" y="0" width="990" height="52" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="24" fill="#f8fafc" font-size="17" font-weight="bold">MÔ HÌNH PHÂN TÍCH THỜI GIAN THANH GHI ĐẾN THANH GHI (FF-TO-FF TIMING MODEL)</text>
    <text x="20" y="42" fill="#94a3b8" font-size="12">Khế ước thời gian và công thức tính toán chính xác tuyệt đối của T_arrival và T_required</text>
  </g>

  <!-- ========================================================================= -->
  <!-- 1. UPPER SECTION: TIMING TIMELINE & DIRECT WAVEFORM ANNOTATIONS -->
  <!-- ========================================================================= -->
  <g transform="translate(35, 80)">
    <rect x="0" y="0" width="990" height="175" rx="10" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="1.5"/>

    <rect x="15" y="10" width="310" height="22" rx="4" fill="#334155"/>
    <text x="25" y="25" fill="#38bdf8" font-size="11" font-weight="bold">1. GIẢN ĐỒ XUNG NHỊP VÀ CÁC MỐC THỜI GIAN</text>

    <!-- Clock Waveform (CLK) -->
    <text x="20" y="62" fill="#38bdf8" font-size="12" font-weight="bold">CLOCK</text>
    <!-- Origin: Launch Edge at X=160, Latch Edge at X=760 -->
    <path d="M 90 70 L 160 70 L 160 40 L 400 40 L 400 70 L 760 70 L 760 40 L 960 40" 
          fill="none" stroke="#38bdf8" stroke-width="2.5"/>

    <!-- Launch Edge at 160 -->
    <line x1="160" y1="85" x2="160" y2="40" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrGreen3)"/>
    <text x="160" y="98" fill="#34d399" font-size="11" font-weight="bold" text-anchor="middle">Launch Edge (t = 0)</text>
    <text x="160" y="112" fill="#94a3b8" font-size="9.5" text-anchor="middle">FF1 phát Data</text>

    <!-- Latch Edge at 760 -->
    <line x1="760" y1="85" x2="760" y2="40" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrCyan3)"/>
    <text x="760" y="98" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">Latch Edge (t = T_clk)</text>
    <text x="760" y="112" fill="#94a3b8" font-size="9.5" text-anchor="middle">FF2 chốt Data</text>

    <!-- Period Bracket -->
    <line x1="160" y1="28" x2="760" y2="28" stroke="#38bdf8" stroke-width="1.5" marker-start="url(#arrCyan3)" marker-end="url(#arrCyan3)"/>
    <rect x="410" y="18" width="100" height="20" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="460" y="32" fill="#e0f2fe" font-size="11" font-weight="bold" text-anchor="middle">Chu kỳ T_clk</text>

    <!-- Setup Window (from 695 to 760 = 65px width) -->
    <rect x="695" y="35" width="65" height="90" fill="url(#hatchRedFf3)"/>
    <rect x="695" y="35" width="65" height="90" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.2"/>
    <text x="727" y="138" fill="#fca5a5" font-size="10.5" font-weight="bold" text-anchor="middle">T_setup</text>
    <text x="727" y="150" fill="#ef4444" font-size="9" text-anchor="middle">(Vùng cấm)</text>

    <!-- Hold Window (from 760 to 815 = 55px width) -->
    <rect x="760" y="35" width="55" height="90" fill="url(#hatchAmberFf3)"/>
    <rect x="760" y="35" width="55" height="90" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="787" y="138" fill="#fde68a" font-size="10.5" font-weight="bold" text-anchor="middle">T_hold</text>
    <text x="787" y="150" fill="#f59e0b" font-size="9" text-anchor="middle">(Giữ mức)</text>

    <!-- T_REQUIRED Marker line at X=695 -->
    <line x1="695" y1="22" x2="695" y2="135" stroke="#38bdf8" stroke-width="2.5"/>
    <rect x="580" y="12" width="230" height="22" rx="4" fill="#0369a1" stroke="#38bdf8" stroke-width="1"/>
    <text x="695" y="27" fill="#ffffff" font-size="10.5" font-weight="bold" text-anchor="middle">🎯 T_required (HẠN CHÓT ĐẾN)</text>

    <!-- DATA ARRIVAL MARKER AT X=520 -->
    <line x1="160" y1="135" x2="520" y2="135" stroke="#fbbf24" stroke-width="2" marker-start="url(#arrAmber3)" marker-end="url(#arrAmber3)"/>
    <rect x="220" y="124" width="240" height="22" rx="4" fill="#78350f" stroke="#fbbf24" stroke-width="1"/>
    <text x="340" y="139" fill="#fde68a" font-size="11" font-weight="bold" text-anchor="middle">🚀 T_arrival (GIỜ ĐẾN THỰC TẾ)</text>

    <!-- Slack Bracket from 520 to 695 -->
    <line x1="520" y1="162" x2="695" y2="162" stroke="#10b981" stroke-width="2" marker-start="url(#arrGreen3)" marker-end="url(#arrGreen3)"/>
    <text x="607" y="158" fill="#6ee7b7" font-size="10.5" font-weight="bold" text-anchor="middle">Setup Slack = T_required - T_arrival ≥ 0</text>
  </g>

  <!-- ========================================================================= -->
  <!-- 2. MIDDLE SECTION: CIRCUIT HARDWARE TOPOLOGY -->
  <!-- ========================================================================= -->
  <g transform="translate(35, 265)">
    <rect x="0" y="0" width="990" height="175" rx="10" fill="#1e293b" fill-opacity="0.5" stroke="#475569" stroke-width="1.5"/>

    <!-- Clock Tree Source Header -->
    <g transform="translate(30, 10)">
      <rect x="0" y="0" width="130" height="24" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="65" y="16" fill="#38bdf8" font-size="10.5" font-weight="bold" text-anchor="middle">CÂY CLOCK (CTS)</text>
    </g>

    <!-- Clock distribution wires -->
    <line x1="160" y1="22" x2="230" y2="22" stroke="#38bdf8" stroke-width="2"/>
    <line x1="230" y1="22" x2="230" y2="125" stroke="#38bdf8" stroke-width="2"/>
    <line x1="230" y1="22" x2="830" y2="22" stroke="#38bdf8" stroke-width="2"/>
    <line x1="830" y1="22" x2="830" y2="125" stroke="#38bdf8" stroke-width="2"/>

    <!-- Clock path latency labels -->
    <rect x="190" y="55" width="80" height="18" rx="3" fill="#0c4a6e"/>
    <text x="230" y="68" fill="#7dd3fc" font-size="9.5" font-weight="bold" text-anchor="middle">T_clk1</text>

    <rect x="790" y="55" width="80" height="18" rx="3" fill="#0c4a6e"/>
    <text x="830" y="68" fill="#7dd3fc" font-size="9.5" font-weight="bold" text-anchor="middle">T_clk2</text>

    <line x1="230" y1="125" x2="160" y2="125" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrCyan3)"/>
    <line x1="830" y1="125" x2="885" y2="125" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrCyan3)"/>

    <!-- LAUNCH FLIP-FLOP (FF1) -->
    <g transform="translate(60, 45)">
      <rect x="0" y="0" width="100" height="115" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <text x="50" y="22" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">LAUNCH FF</text>
      <text x="50" y="35" fill="#94a3b8" font-size="9" text-anchor="middle">(FF1)</text>

      <text x="12" y="60" fill="#64748b" font-size="10">D1</text>
      <polygon points="5,76 15,80 5,84" fill="#38bdf8"/>
      <text x="18" y="83" fill="#38bdf8" font-size="10" font-weight="bold">CK</text>
      <text x="88" y="60" fill="#fbbf24" font-size="11" font-weight="bold" text-anchor="end">Q1</text>
    </g>

    <!-- Arrow Q1 to Logic Cloud with T_cq -->
    <line x1="160" y1="105" x2="275" y2="105" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arrAmber3)"/>
    <rect x="180" y="112" width="75" height="20" rx="3" fill="#0369a1"/>
    <text x="217" y="126" fill="#e0f2fe" font-size="9.5" font-weight="bold" text-anchor="middle">T_cq (0.4ns)</text>

    <!-- COMBINATIONAL LOGIC CLOUD (T_DATA) -->
    <g transform="translate(275, 40)">
      <rect x="0" y="0" width="490" height="125" rx="12" fill="url(#cloudGradFf3)" stroke="#6366f1" stroke-width="2"/>
      <text x="245" y="22" fill="#c7d2fe" font-size="12" font-weight="bold" text-anchor="middle">MẠNG LOGIC TỔ HỢP (COMBINATIONAL CLOUD)</text>

      <!-- Subpath: Critical Path -->
      <rect x="25" y="40" width="210" height="55" rx="6" fill="#1e1b4b" stroke="#ef4444" stroke-width="1.5"/>
      <text x="130" y="58" fill="#fca5a5" font-size="10.5" font-weight="bold" text-anchor="middle">ĐƯỜNG DÀI NHẤT (Critical Path)</text>
      <text x="130" y="74" fill="#fde68a" font-size="11" font-weight="bold" text-anchor="middle">T_data_max = 11.60ns</text>
      <text x="130" y="88" fill="#cbd5e1" font-size="9" text-anchor="middle">Dùng để tính Setup Slack</text>

      <!-- Subpath: Shortest Path -->
      <rect x="255" y="40" width="210" height="55" rx="6" fill="#1e1b4b" stroke="#10b981" stroke-width="1.5"/>
      <text x="360" y="58" fill="#a7f3d0" font-size="10.5" font-weight="bold" text-anchor="middle">ĐƯỜNG NGẮN NHẤT (Shortest Path)</text>
      <text x="360" y="74" fill="#6ee7b7" font-size="11" font-weight="bold" text-anchor="middle">T_data_min = 2.10ns</text>
      <text x="360" y="88" fill="#cbd5e1" font-size="9" text-anchor="middle">Dùng để tính Hold Slack</text>

      <text x="245" y="112" fill="#e0e7ff" font-size="10" text-anchor="middle">Độ trễ do cấu trúc các cổng logic và ký sinh đường dây kim loại RC</text>
    </g>

    <!-- Arrow Logic Cloud to FF2.D -->
    <line x1="765" y1="105" x2="885" y2="105" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arrAmber3)"/>

    <!-- CAPTURE FLIP-FLOP (FF2) -->
    <g transform="translate(885, 45)">
      <rect x="0" y="0" width="100" height="115" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
      <text x="50" y="22" fill="#10b981" font-size="11" font-weight="bold" text-anchor="middle">CAPTURE FF</text>
      <text x="50" y="35" fill="#94a3b8" font-size="9" text-anchor="middle">(FF2 / Latch)</text>

      <text x="12" y="60" fill="#fbbf24" font-size="11" font-weight="bold">D2</text>
      <polygon points="5,76 15,80 5,84" fill="#10b981"/>
      <text x="18" y="83" fill="#10b981" font-size="10" font-weight="bold">CK</text>
      <text x="88" y="60" fill="#64748b" font-size="10" text-anchor="end">Q2</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- 3. LOWER SECTION: EXACT MATHEMATICAL FORMULAS (PURE SVG TEXT) -->
  <!-- ========================================================================= -->
  <g transform="translate(35, 450)">
    <rect x="0" y="0" width="990" height="225" rx="10" fill="#1e293b" fill-opacity="0.95" stroke="#334155" stroke-width="1.5"/>

    <!-- BOX 1: SETUP TIMING FORMULAS -->
    <g transform="translate(20, 15)">
      <rect x="0" y="0" width="465" height="195" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <!-- Header Badge -->
      <rect x="15" y="10" width="340" height="24" rx="4" fill="#0369a1"/>
      <text x="25" y="26" fill="#ffffff" font-size="12" font-weight="bold">1. KHẾ ƯỚC SETUP (CHỐNG DỮ LIỆU ĐI CHẬM)</text>

      <!-- T_arrival label & formula pill -->
      <text x="15" y="54" fill="#94a3b8" font-size="11" font-weight="bold">• Thời gian đến thực tế (Data Arrival Time):</text>
      <rect x="15" y="62" width="435" height="28" rx="4" fill="#1e1b4b" stroke="#f59e0b" stroke-width="1"/>
      <text x="25" y="81" fill="#fde68a" font-family="monospace" font-size="12.5" font-weight="bold">T_arrival = Launch_Edge + T_clk1 + T_cq + T_data_max</text>

      <!-- T_required label & formula pill -->
      <text x="15" y="110" fill="#94a3b8" font-size="11" font-weight="bold">• Hạn chót bắt buộc đến (Data Required Time):</text>
      <rect x="15" y="118" width="435" height="28" rx="4" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1"/>
      <text x="25" y="137" fill="#7dd3fc" font-family="monospace" font-size="12.5" font-weight="bold">T_required = Latch_Edge + T_clk2 - T_setup - T_unc</text>

      <!-- Slack Verdict -->
      <line x1="15" y1="156" x2="450" y2="156" stroke="#334155" stroke-width="1"/>
      <text x="232" y="178" fill="#34d399" font-size="13" font-weight="bold" text-anchor="middle">Setup Slack = T_required - T_arrival ≥ 0  (ĐẠT CHUẨN)</text>
    </g>

    <!-- BOX 2: HOLD TIMING FORMULAS -->
    <g transform="translate(505, 15)">
      <rect x="0" y="0" width="465" height="195" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
      <!-- Header Badge -->
      <rect x="15" y="10" width="340" height="24" rx="4" fill="#78350f"/>
      <text x="25" y="26" fill="#fde68a" font-size="12" font-weight="bold">2. KHẾ ƯỚC HOLD (CHỐNG DỮ LIỆU CHẠY QUÁ NHANH)</text>

      <!-- T_arrival_min label & formula pill -->
      <text x="15" y="54" fill="#94a3b8" font-size="11" font-weight="bold">• Thời gian đến sớm nhất (Data Arrival Min):</text>
      <rect x="15" y="62" width="435" height="28" rx="4" fill="#1e1b4b" stroke="#f59e0b" stroke-width="1"/>
      <text x="25" y="81" fill="#fde68a" font-family="monospace" font-size="12.5" font-weight="bold">T_arrival_min = Launch_Edge + T_clk1 + T_cq + T_data_min</text>

      <!-- T_required_hold label & formula pill -->
      <text x="15" y="110" fill="#94a3b8" font-size="11" font-weight="bold">• Mốc kết thúc giữ mức (Data Required Hold):</text>
      <rect x="15" y="118" width="435" height="28" rx="4" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
      <text x="25" y="137" fill="#fca5a5" font-family="monospace" font-size="12.5" font-weight="bold">T_required_hold = Latch_Edge (0) + T_clk2 + T_hold + T_unc</text>

      <!-- Slack Verdict -->
      <line x1="15" y1="156" x2="450" y2="156" stroke="#334155" stroke-width="1"/>
      <text x="232" y="178" fill="#6ee7b7" font-size="13" font-weight="bold" text-anchor="middle">Hold Slack = T_arrival_min - T_required_hold ≥ 0  (ĐẠT CHUẨN)</text>
    </g>
  </g>
</svg>