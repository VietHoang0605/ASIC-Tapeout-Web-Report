<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 750" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <!-- Chip Core Fill Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Register Gradient -->
    <linearGradient id="regGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>

    <!-- Combinational Cloud Gradient -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Pin Gradients -->
    <linearGradient id="inPinGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="outPinGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arrCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrGold" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#c084fc"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#34d399"/>
    </marker>
    <marker id="arrClock" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M 0 1 L 6 3.5 L 0 6 z" fill="#cbd5e1"/>
    </marker>

    <!-- Glow Filters -->
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1100" height="750" fill="url(#bgGrad)"/>
  
  <!-- Outer Frame -->
  <rect x="15" y="15" width="1070" height="720" rx="14" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(40, 42)">
    <rect x="0" y="0" width="4" height="28" rx="2" fill="#38bdf8"/>
    <text x="16" y="21" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="19" font-weight="bold" letter-spacing="0.5">BỐN NHÓM ĐƯỜNG TIMING CĂN BẢN TRONG THIẾT KẾ ASIC (THE 4 TIMING PATHS)</text>
    <text x="16" y="44" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Phân loại chi tiết cấp độ Chân vật lý (Pin-to-Pin) và Khối mạch (Block-to-Block) theo chuẩn OpenSTA / PrimeTime</text>
  </g>

  <!-- ==================== CHIP DIE / BOUNDARY ==================== -->
  <!-- Chip Boundary Box -->
  <rect x="160" y="105" width="780" height="435" rx="16" fill="url(#coreGrad)" stroke="#475569" stroke-width="2" stroke-dasharray="8 6"/>
  
  <!-- Chip Core Badge -->
  <rect x="475" y="93" width="150" height="24" rx="12" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
  <text x="550" y="109" fill="#38bdf8" font-family="monospace" font-size="11.5" font-weight="bold" text-anchor="middle">CHIP CORE BOUNDARY</text>

  <!-- ==================== IO PADS / EXTERNAL PINS ==================== -->
  <!-- Left: In Pin 1 -->
  <g transform="translate(45, 175)">
    <rect x="0" y="0" width="95" height="48" rx="6" fill="url(#inPinGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="47" y="20" fill="#0f172a" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">KHỐI INPUT PAD 1</text>
    <text x="47" y="34" fill="#0369a1" font-family="monospace" font-size="10.5" font-weight="bold" text-anchor="middle">Chân: PAD_IN1</text>
    <circle cx="95" cy="24" r="4" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- Left: In Pin 2 -->
  <g transform="translate(45, 435)">
    <rect x="0" y="0" width="95" height="48" rx="6" fill="url(#inPinGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="47" y="20" fill="#0f172a" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">KHỐI INPUT PAD 2</text>
    <text x="47" y="34" fill="#0369a1" font-family="monospace" font-size="10.5" font-weight="bold" text-anchor="middle">Chân: PAD_IN2</text>
    <circle cx="95" cy="24" r="4" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- Right: Out Pin 1 -->
  <g transform="translate(960, 315)">
    <rect x="0" y="0" width="95" height="48" rx="6" fill="url(#outPinGrad)" stroke="#c084fc" stroke-width="1.5"/>
    <text x="47" y="20" fill="#0f172a" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">KHỐI OUTPUT PAD 1</text>
    <text x="47" y="34" fill="#581c87" font-family="monospace" font-size="10.5" font-weight="bold" text-anchor="middle">Chân: PAD_OUT1</text>
    <circle cx="0" cy="24" r="4" fill="#c084fc" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- Right: Out Pin 2 -->
  <g transform="translate(960, 435)">
    <rect x="0" y="0" width="95" height="48" rx="6" fill="url(#outPinGrad)" stroke="#c084fc" stroke-width="1.5"/>
    <text x="47" y="20" fill="#0f172a" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">KHỐI OUTPUT PAD 2</text>
    <text x="47" y="34" fill="#581c87" font-family="monospace" font-size="10.5" font-weight="bold" text-anchor="middle">Chân: PAD_OUT2</text>
    <circle cx="0" cy="24" r="4" fill="#c084fc" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- ==================== CLOCK NETWORK / DISTRIBUTION ==================== -->
  <!-- Clock Source Port -->
  <rect x="490" y="128" width="120" height="28" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="550" y="146" fill="#f8fafc" font-family="monospace" font-size="11.5" font-weight="bold" text-anchor="middle">CHÂN CLK (Port)</text>
  
  <!-- Clock Tree Distribution Lines -->
  <path d="M 550 156 L 550 168 L 420 168 L 420 185" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrClock)"/>
  <path d="M 550 168 L 690 168 L 690 300" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrClock)"/>

  <!-- ==================== INTERNAL CIRCUIT ELEMENTS ==================== -->

  <!-- === COMBINATIONAL LOGIC 1 (In2Reg) === -->
  <g transform="translate(210, 175)">
    <rect x="0" y="0" width="125" height="48" rx="10" fill="url(#cloudGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="62" y="22" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Mạch Tổ Hợp CL1</text>
    <text x="62" y="37" fill="#94a3b8" font-family="monospace" font-size="9.5" text-anchor="middle">Chân: In_A → Out_Y</text>
  </g>

  <!-- === REGISTER 1 (Reg1 / FF1) === -->
  <g transform="translate(385, 185)">
    <rect x="0" y="0" width="70" height="95" rx="8" fill="url(#regGrad)" stroke="#60a5fa" stroke-width="2"/>
    <text x="35" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">REG 1</text>
    <text x="35" y="38" fill="#bfdbfe" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">(Launch FF)</text>
    <!-- Pins with explicit dots -->
    <circle cx="0" cy="58" r="3.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1"/>
    <text x="9" y="62" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">D</text>
    
    <circle cx="70" cy="58" r="3.5" fill="#fbbf24" stroke="#ffffff" stroke-width="1"/>
    <text x="49" y="62" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">Q</text>
    
    <!-- Clock Triangle -->
    <path d="M 30 0 L 35 10 L 40 0" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="35" cy="0" r="3" fill="#cbd5e1"/>
    <text x="35" y="84" fill="#93c5fd" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">Chân CK</text>
  </g>

  <!-- === COMBINATIONAL LOGIC 2 (Reg2Reg - Core Critical Path) === -->
  <g transform="translate(500, 240)">
    <rect x="0" y="0" width="125" height="52" rx="10" fill="url(#cloudGrad)" stroke="#fbbf24" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="62" y="22" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Mạch Tổ Hợp CL2</text>
    <text x="62" y="38" fill="#fde68a" font-family="monospace" font-size="9.5" text-anchor="middle">Chân: In_A → Out_Y</text>
    <text x="62" y="48" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="8.5" text-anchor="middle">(Đường tới hạn Critical)</text>
  </g>

  <!-- === REGISTER 2 (Reg2 / FF2) === -->
  <g transform="translate(655, 300)">
    <rect x="0" y="0" width="70" height="95" rx="8" fill="url(#regGrad)" stroke="#60a5fa" stroke-width="2"/>
    <text x="35" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">REG 2</text>
    <text x="35" y="38" fill="#bfdbfe" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">(Latch / Launch)</text>
    <!-- Pins with explicit dots -->
    <circle cx="0" cy="58" r="3.5" fill="#fbbf24" stroke="#ffffff" stroke-width="1"/>
    <text x="9" y="62" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">D</text>
    
    <circle cx="70" cy="58" r="3.5" fill="#c084fc" stroke="#ffffff" stroke-width="1"/>
    <text x="49" y="62" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">Q</text>
    
    <!-- Clock Triangle -->
    <path d="M 30 0 L 35 10 L 40 0" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="35" cy="0" r="3" fill="#cbd5e1"/>
    <text x="35" y="84" fill="#93c5fd" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">Chân CK</text>
  </g>

  <!-- === COMBINATIONAL LOGIC 3 (Reg2Out) === -->
  <g transform="translate(775, 315)">
    <rect x="0" y="0" width="125" height="48" rx="10" fill="url(#cloudGrad)" stroke="#c084fc" stroke-width="1.5"/>
    <text x="62" y="22" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Mạch Tổ Hợp CL3</text>
    <text x="62" y="37" fill="#94a3b8" font-family="monospace" font-size="9.5" text-anchor="middle">Chân: In_A → Out_Y</text>
  </g>

  <!-- === COMBINATIONAL LOGIC 4 (In2Out - Pure Combinational) === -->
  <g transform="translate(430, 435)">
    <rect x="0" y="0" width="240" height="48" rx="10" fill="url(#cloudGrad)" stroke="#34d399" stroke-width="1.5"/>
    <text x="120" y="22" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">Mạch Tổ Hợp Xuyên Suốt CL4</text>
    <text x="120" y="37" fill="#6ee7b7" font-family="monospace" font-size="9.5" text-anchor="middle">Đường thuần tổ hợp (Không qua chân CK/D/Q của FF)</text>
  </g>


  <!-- ==================== THE 4 TIMING PATH WIRES ==================== -->

  <!-- PATH 1: In2Reg (Cyan) -->
  <path d="M 140 199 L 210 199" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrCyan)"/>
  <path d="M 335 199 L 360 199 L 360 243 L 385 243" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrCyan)"/>
  
  <!-- Path 1 Badge -->
  <g transform="translate(180, 136)">
    <rect x="0" y="0" width="160" height="26" rx="5" fill="#0369a1" stroke="#38bdf8" stroke-width="1"/>
    <text x="80" y="17" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">PATH 1: IN2REG</text>
  </g>

  <!-- PATH 2: Reg2Reg (Gold / Amber) -->
  <path d="M 455 243 L 475 243 L 475 266 L 500 266" fill="none" stroke="#fbbf24" stroke-width="3.5" filter="url(#glowGold)" marker-end="url(#arrGold)"/>
  <path d="M 625 266 L 640 266 L 640 358 L 655 358" fill="none" stroke="#fbbf24" stroke-width="3.5" filter="url(#glowGold)" marker-end="url(#arrGold)"/>
  
  <!-- Path 2 Badge (Core Backbone) -->
  <g transform="translate(485, 200)">
    <rect x="0" y="0" width="155" height="26" rx="5" fill="#78350f" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="77" y="17" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">PATH 2: REG2REG (CỐT TỬ)</text>
  </g>

  <!-- PATH 3: Reg2Out (Purple) -->
  <path d="M 725 358 L 750 358 L 750 339 L 775 339" fill="none" stroke="#c084fc" stroke-width="2.5" marker-end="url(#arrPurple)"/>
  <path d="M 900 339 L 960 339" fill="none" stroke="#c084fc" stroke-width="2.5" marker-end="url(#arrPurple)"/>

  <!-- Path 3 Badge -->
  <g transform="translate(760, 270)">
    <rect x="0" y="0" width="160" height="26" rx="5" fill="#581c87" stroke="#c084fc" stroke-width="1"/>
    <text x="80" y="17" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">PATH 3: REG2OUT</text>
  </g>

  <!-- PATH 4: In2Out (Green) -->
  <path d="M 140 459 L 430 459" fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrGreen)"/>
  <path d="M 670 459 L 960 459" fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrGreen)"/>

  <!-- Path 4 Badge -->
  <g transform="translate(470, 495)">
    <rect x="0" y="0" width="160" height="26" rx="5" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
    <text x="80" y="17" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">PATH 4: IN2OUT</text>
  </g>


  <!-- ==================== SUMMARY DETAIL CARDS (BOTTOM TABLE) ==================== -->

  <!-- Card 1: In2Reg -->
  <g transform="translate(40, 560)">
    <rect x="0" y="0" width="235" height="165" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="235" height="30" rx="10" fill="#0369a1"/>
    <text x="117" y="20" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">Path 1: In2Reg (Input → Reg)</text>
    
    <text x="10" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">Khối &amp; Chân bắt đầu:</text>
    <text x="10" y="63" fill="#38bdf8" font-family="monospace" font-size="10.5" font-weight="bold">Khối Pad_In ──► Chân PAD_IN1</text>
    
    <text x="10" y="85" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">Khối &amp; Chân kết thúc:</text>
    <text x="10" y="100" fill="#38bdf8" font-family="monospace" font-size="10.5" font-weight="bold">Khối Reg 1 ──► Chân D</text>
    
    <text x="10" y="120" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Kiểm tra bởi: Chân CK của Reg 1</text>
    <rect x="8" y="127" width="219" height="28" rx="4" fill="#1e293b"/>
    <text x="15" y="145" fill="#7dd3fc" font-family="monospace" font-size="10" font-weight="bold">set_input_delay -clock CLK</text>
  </g>

  <!-- Card 2: Reg2Reg -->
  <g transform="translate(295, 560)">
    <rect x="0" y="0" width="245" height="165" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
    <rect x="0" y="0" width="245" height="30" rx="10" fill="#b45309"/>
    <text x="122" y="20" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">Path 2: Reg2Reg (&gt;90% CORE)</text>
    
    <text x="10" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">Khối &amp; Chân bắt đầu:</text>
    <text x="10" y="63" fill="#fbbf24" font-family="monospace" font-size="10.5" font-weight="bold">Reg 1 ──► Chân CK kích / ra Q</text>
    
    <text x="10" y="85" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">Khối &amp; Chân kết thúc:</text>
    <text x="10" y="100" fill="#fbbf24" font-family="monospace" font-size="10.5" font-weight="bold">Reg 2 ──► Chân D (Latch)</text>
    
    <text x="10" y="120" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Kiểm tra bởi: Chân CK của Reg 2</text>
    <rect x="8" y="127" width="229" height="28" rx="4" fill="#1e293b"/>
    <text x="15" y="145" fill="#fde68a" font-family="monospace" font-size="10" font-weight="bold">create_clock -period T_clk</text>
  </g>

  <!-- Card 3: Reg2Out -->
  <g transform="translate(560, 560)">
    <rect x="0" y="0" width="235" height="165" rx="10" fill="#0f172a" stroke="#c084fc" stroke-width="1.5"/>
    <rect x="0" y="0" width="235" height="30" rx="10" fill="#7e22ce"/>
    <text x="117" y="20" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">Path 3: Reg2Out (Reg → Output)</text>
    
    <text x="10" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">Khối &amp; Chân bắt đầu:</text>
    <text x="10" y="63" fill="#c084fc" font-family="monospace" font-size="10.5" font-weight="bold">Reg 2 ──► Chân CK kích / ra Q</text>
    
    <text x="10" y="85" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">Khối &amp; Chân kết thúc:</text>
    <text x="10" y="100" fill="#c084fc" font-family="monospace" font-size="10.5" font-weight="bold">Khối Pad_Out ──► Chân PAD_OUT1</text>
    
    <text x="10" y="120" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Kiểm tra bởi: Clock ngoài chip</text>
    <rect x="8" y="127" width="219" height="28" rx="4" fill="#1e293b"/>
    <text x="15" y="145" fill="#e9d5ff" font-family="monospace" font-size="10" font-weight="bold">set_output_delay -clock CLK</text>
  </g>

  <!-- Card 4: In2Out -->
  <g transform="translate(815, 560)">
    <rect x="0" y="0" width="245" height="165" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
    <rect x="0" y="0" width="245" height="30" rx="10" fill="#047857"/>
    <text x="122" y="20" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">Path 4: In2Out (Pure Comb)</text>
    
    <text x="10" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">Khối &amp; Chân bắt đầu:</text>
    <text x="10" y="63" fill="#34d399" font-family="monospace" font-size="10.5" font-weight="bold">Khối Pad_In ──► Chân PAD_IN2</text>
    
    <text x="10" y="85" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">Khối &amp; Chân kết thúc:</text>
    <text x="10" y="100" fill="#34d399" font-family="monospace" font-size="10.5" font-weight="bold">Khối Pad_Out ──► Chân PAD_OUT2</text>
    
    <text x="10" y="120" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Không qua chân CK/D/Q của FF</text>
    <rect x="8" y="127" width="229" height="28" rx="4" fill="#1e293b"/>
    <text x="15" y="145" fill="#a7f3d0" font-family="monospace" font-size="10" font-weight="bold">set_max_delay &lt;T_delay&gt;</text>
  </g>

</svg>
